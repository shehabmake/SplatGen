name: Release add-on

# Push a tag like v5.3.1 to build the add-on zip and publish it as a GitHub
# Release. The tag must match the version in blender_addon/blender_manifest.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the add-on version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('blender_addon/blender_manifest.toml','rb'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Build the zip
        run: python tools/build_addon_zip.py

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: SplatGen Prepare ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.zip
