name: Release add-on

# Publishes blender_addon as a downloadable zip on the GitHub Releases page.
# Runs when main (or the add-on development branch) is pushed; if no release
# exists yet for the version in blender_addon/blender_manifest.toml, it builds
# the zip and creates release v<version>. Bump the version to publish a new one.
on:
  push:
    branches: ["main", "claude/busy-newton-wb615a"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the add-on version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('blender_addon/blender_manifest.toml','rb'))['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.version.outputs.publish == 'true'
        run: python tools/build_addon_zip.py

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SplatGen Prepare ${{ steps.version.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.zip
