[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatgen"
version = "0.1.0"
description = "SplatGen: train Gaussian splats from 3D-software datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "torch>=2.1",
  "numpy",
  "pillow",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
gpu = ["gsplat>=1.4"]
native = ["pywebview>=5"]
dev = ["pytest", "httpx", "playwright"]

[project.scripts]
splatgen = "splatgen.cli:main"

[tool.setuptools.packages.find]
include = ["splatgen*"]

[tool.setuptools.package-data]
splatgen = ["web/*.html", "web/css/*.css", "web/js/*.js", "web/js/*/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
